[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-cost-killswitch"
version = "0.1.0"
description = "Cost and loop-depth kill-switch middleware for agent loops, with fallback to a cheaper or local model."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "John Houghton" }]
dependencies = [
  "pydantic>=2",
  "PyYAML>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
killswitch = "killswitch.cli:main"

[tool.setuptools.packages.find]
include = ["killswitch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
